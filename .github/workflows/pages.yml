name: Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # dist/ must stay exactly as built: no sed or rewrites afterwards, or the
      # service worker precache revisions no longer match the files.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VITE_PUBLIC_REPO_URL: https://github.com/${{ github.repository }}
          # Only tag runs carry a release version; otherwise vite.config falls back to package.json.
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          VITE_GIT_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
